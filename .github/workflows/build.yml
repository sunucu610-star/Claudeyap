name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Derle
        run: mvn -B -f "$(find . -name pom.xml | head -n 1)" package
      - name: Jar dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: Market-jar
          path: '**/target/Market.jar'
